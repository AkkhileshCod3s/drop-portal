<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 56" width="270" height="56" role="img" aria-label="Open DropPortal" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Open DropPortal</title><style>
.mono{font-family:'Courier New',ui-monospace,Menlo,Consolas,monospace}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-3px)}}.bob{animation:bob .9s steps(1) infinite}
@keyframes talk{0%,49%{opacity:1}50%,100%{opacity:0}}.mouth{animation:talk .4s steps(1) infinite}
@keyframes look{0%,25%{transform:translateX(0)}30%,55%{transform:translateX(-3px)}60%,80%{transform:translateX(3px)}85%,100%{transform:translateX(0)}}.pup{animation:look 6s steps(1) infinite}
@keyframes blinkl{0%,92%{transform:scaleY(0)}94%,97%{transform:scaleY(1)}99%,100%{transform:scaleY(0)}}.lid{transform-box:fill-box;transform-origin:50% 0%;animation:blinkl 5s steps(1) infinite}
@keyframes lgA{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-3px)}}@keyframes lgB{0%,49%{transform:translateY(-3px)}50%,100%{transform:translateY(0)}}
.lgA{animation:lgA .6s steps(1) infinite}.lgB{animation:lgB .6s steps(1) infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}.tw{animation:tw 2s steps(2) infinite}
@keyframes lt{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-6px)}}.lt{animation:lt 3.2s steps(2) infinite}
@keyframes glow{0%,100%{opacity:.12}50%{opacity:.32}}.glow{animation:glow 2s steps(4) infinite}
@keyframes sp{0%,100%{opacity:.1}50%{opacity:1}}.sp{animation:sp 2s steps(4) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes crawl{0%{transform:translateX(0)}100%{transform:translateX(676px)}}.crawl{animation:crawl 12s linear infinite}
@keyframes fa{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes fb{0%,49%{opacity:0}50%,100%{opacity:1}}
.bgA{animation:fa .5s steps(1) infinite}.bgB{animation:fb .5s steps(1) infinite}
@keyframes bd{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}.bd{animation:bd 2s steps(4) infinite}@keyframes ar{0%,49%{opacity:1}50%,100%{opacity:.2}}.ar{animation:ar 1s steps(1) infinite}</style><defs></defs>
<rect width="270" height="56" rx="6" fill="#0d1117"/><rect x="1" y="1" width="268" height="54" rx="5" fill="none" stroke="#30363d" stroke-width="2"/>
<rect class="bd" x="3" y="3" width="264" height="50" fill="#0d1117" stroke="#facc15" stroke-width="3"/><rect x="12" y="12" width="32" height="32" fill="#facc15"/><rect x="22" y="18" width="12" height="16" fill="#fff"/><rect x="29" y="18" width="5" height="5" fill="#facc15"/><rect x="25" y="28" width="6" height="2" fill="#facc15"/><text x="56" y="34" class="mono" font-size="16" font-weight="bold" fill="#e6edf3">Open DropPortal</text><text class="ar mono" x="246" y="34" font-size="16" font-weight="bold" fill="#facc15">&gt;</text></svg>